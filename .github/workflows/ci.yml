name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.8-alpine
        env:
          POSTGRES_DB: flow
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      FLOW_DATABASE_URL: postgres://flow:flow@127.0.0.1:5432/flow
      FLOW_AUTH_MODE: development
      FLOW_ENABLE_WEBCMD: 'false'
      FLOW_ENABLE_WEB_DEAL_RESEARCH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run verify
      - run: npm run db:migrate
      - name: Build container targets
        run: |
          docker build --target api -t flow-api:ci .
          docker build --target worker -t flow-worker:ci .
          docker build --target web -t flow-web:ci .
